<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="../static/pay.css">
</head>
<body>
    <div class="container">
        <h1>Shipping Information</h1>
        <form id="address-form">
            <label for="street">Enter Your Name:</label>
            <input type="text" id="street" name="street" required><br>

            <label for="street">Street Address:</label>
            <input type="text" id="street" name="street" required><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required><br>

            <label for="state">State:</label>
            <input type="text" id="state" name="state" required><br>

            <label for="zip">PIN Code:</label>
            <input type="text" id="zip" name="zip" required><br>

            <h1>Payment Information</h1>
            <div>
                <label for="payment-method">Payment Method:</label>
                <select id="payment-method" name="payment-method" required>
                    <option value="card">Credit/Debit Card</option>
                    <option value="upi">UPI</option>
                    <option value="QR">QR</option>
                </select>
            </div>

            <div id="card-payment">
                <label for="card">Card Number:</label>
                <input type="text" id="card" name="card" required><br>

                <label for="exp">Expiration Date:</label>
                <input type="text" id="exp" name="exp" placeholder="MM/YY" required><br>

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" required><br>
            </div>

            <div id="upi-payment" style="display: none;">
                <label for="upi-id">UPI ID:</label>
                <input type="text" id="upi-id" name="upi-id" required><br>
                
                <!-- You can add a QR code scanner here if needed -->
            </div>

            <button type="submit" onclick="alert('Lagta hai jada paisa aa gaya hai')">Submit</button>
        </form>
    </div>

    <script src="../static/js/pay.js"></script>
</body>
</html>
